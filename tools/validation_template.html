<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyTrip 정확도 검증</title>
<style>
:root{--bg:#F6F8FA;--card:#fff;--ink:#16202A;--ink2:#4A5866;--ink3:#7A8794;--line:#DFE5EA;--acc:#1580B8;--acc-t:#E6F3FB;
  --ok:#1E7F4E;--ok-bg:#E4F5EC;--cau:#8A5A00;--cau-bg:#FFF1CC;--no:#A3261B;--no-bg:#FBE3E1;--gr-bg:#ECEFF2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161B;--card:#1A2129;--ink:#E8EEF3;--ink2:#B4C0CB;--ink3:#8593A0;--line:#2C3642;--acc:#5DB4E6;--acc-t:#16303F;
  --ok:#7FD6A5;--ok-bg:#16352A;--cau:#F1C75B;--cau-bg:#3A3015;--no:#F29A90;--no-bg:#3D1E1B;--gr-bg:#252D36}}
:root[data-theme="dark"]{--bg:#11161B;--card:#1A2129;--ink:#E8EEF3;--ink2:#B4C0CB;--ink3:#8593A0;--line:#2C3642;--acc:#5DB4E6;--acc-t:#16303F;
  --ok:#7FD6A5;--ok-bg:#16352A;--cau:#F1C75B;--cau-bg:#3A3015;--no:#F29A90;--no-bg:#3D1E1B;--gr-bg:#252D36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:22px;margin:4px 0 6px}
.lead{color:var(--ink2);margin:0 0 14px;font-size:14px}
.sum{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 16px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.sum-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar{height:6px;background:var(--gr-bg);border-radius:9px;overflow:hidden;margin:8px 0 10px}.bar i{display:block;height:100%;background:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink3)}
.btns{display:flex;gap:6px}
button{font:inherit;cursor:pointer}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600;min-height:36px}
.b.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.guide{background:var(--acc-t);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink2);margin:0 0 16px}
.guide b{color:var(--ink)}
.guide ol{margin:6px 0 0;padding-left:18px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.it.done{border-color:var(--acc)}
.it-hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.no{font-size:12px;color:var(--ink3);font-weight:700}
.nm{font-size:17px;font-weight:700;margin:2px 0}
.meta{font-size:12.5px;color:var(--ink3)}
.v{flex-shrink:0;font-weight:800;border-radius:9px;padding:5px 10px;font-size:14px;text-align:center}
.v small{display:block;font-size:10.5px;font-weight:600;opacity:.8}
.v-가능{background:var(--ok-bg);color:var(--ok)}.v-부분{background:var(--cau-bg);color:var(--cau)}.v-불가{background:var(--no-bg);color:var(--no)}.v-미확인{background:var(--gr-bg);color:var(--ink2)}
.ev{margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--acc);background:var(--bg);border-radius:0 9px 9px 0;font-size:14px}
.ev em{display:block;font-style:normal;color:var(--cau);font-size:13px;margin-top:4px}
.ev .src{font-size:12px;color:var(--ink3)}
a.open{display:inline-block;margin-top:10px;font-weight:700;color:var(--acc);text-decoration:none;font-size:14px}
.qs{margin-top:12px;display:grid;gap:10px}
.q{font-size:13.5px}
.q>span{display:block;color:var(--ink2);margin-bottom:5px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0}
.opts label span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px;background:var(--card)}
.opts input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.opts input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.memo{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px;background:var(--card);color:var(--ink)}
.foot{font-size:12.5px;color:var(--ink3);margin-top:20px}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr 1fr}.kpi b{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>EasyTrip AI 판정 정확도 검증</h1>
  <p class="lead" id="lead"></p>
  <div class="sum" id="sum"></div>
  <div class="guide">
    <b>이렇게 해줘</b>
    <ol>
      <li><b>원문 열기</b>로 블로그 글을 연다.</li>
      <li>그 글이 이 장소 얘기인지 본다. 다른 장소 얘기면 ‘아니오’.</li>
      <li>AI 근거는 <b>요약문</b>이야. 문장이 똑같지 않아도 같은 사실이 글에 있으면 ‘있음’, 글에 없는 사실이 섞였으면 ‘일부만’, 전혀 없으면 ‘없음’.</li>
      <li>휠체어 판정이 글 내용으로 맞는지 고른다. 글만으로 알 수 없으면 ‘판단 불가’.</li>
    </ol>
    답은 이 브라우저에만 저장돼. 다 하면 <b>CSV 내보내기</b>로 파일을 받아서 보내줘.
  </div>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</div>
<script>
const DATA=/*DATA*/null;
const KEY='et-valid-'+(DATA.meta.only||DATA.meta.seed)+'-'+DATA.meta.n;
let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const QS=[
  ['place','원문이 이 장소 얘기야?',['예','아니오']],
  ['evi','AI 근거가 원문에 있어?',['있음','일부만','없음']],
  ['verdict','휠체어 판정이 맞아?',['맞음','틀림','판단 불가']]];
/* 윌슨 95% 신뢰구간 */
function wilson(k,n){if(!n)return null;const z=1.96,p=k/n,d=1+z*z/n,c=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return [Math.max(0,c-h),Math.min(1,c+h)]}
const pct=x=>(x*100).toFixed(1)+'%';
function stat(){
  const v=Object.values(A),m=DATA.meta;
  const done=DATA.items.filter(it=>{const a=A[it.id]||{};return a.place&&a.evi&&a.verdict}).length;
  const ok=v.filter(a=>a.verdict==='맞음').length,bad=v.filter(a=>a.verdict==='틀림').length,unk=v.filter(a=>a.verdict==='판단 불가').length;
  const ev=v.filter(a=>a.evi).length,hal=v.filter(a=>a.evi==='없음').length,part=v.filter(a=>a.evi==='일부만').length;
  const pl=v.filter(a=>a.place).length,plno=v.filter(a=>a.place==='아니오').length;
  const acc=ok+bad?ok/(ok+bad):null,ci=wilson(ok,ok+bad),hr=ev?hal/ev:null,hci=wilson(hal,ev);
  document.getElementById('sum').innerHTML=`<div class="sum-top"><b>완료 ${done} / ${m.n}</b><div class="btns"><button class="b pri" onclick="exportCSV()">CSV 내보내기</button><button class="b" onclick="resetAll()">초기화</button></div></div>
   <div class="bar"><i style="width:${done/m.n*100}%"></i></div>
   <div class="kpis">
    <div class="kpi"><span>판정 정확도</span><b>${acc==null?'–':pct(acc)}</b><span>${ok}/${ok+bad}${ci?` · 95% ${pct(ci[0])}~${pct(ci[1])}`:''}${unk?` · 판단불가 ${unk}`:''}</span></div>
    <div class="kpi"><span>근거 환각률</span><b>${hr==null?'–':pct(hr)}</b><span>없음 ${hal}/${ev}${hci?` · 95% ${pct(hci[0])}~${pct(hci[1])}`:''}${part?` · 일부만 ${part}`:''}</span></div>
    <div class="kpi"><span>장소 불일치</span><b>${pl?plno:'–'}</b><span>응답 ${pl}곳 중</span></div>
   </div>`;
}
function render(){
  const m=DATA.meta;
  document.getElementById('lead').innerHTML=m.only?`AI가 ‘${esc(m.only)}’로 판정한 <b>${m.n}곳 전부</b>를 검증해. 무작위 표본에는 ‘${esc(m.only)}’가 거의 안 들어가서 따로 봐야 해.`:`앱에 들어간 AI 판정 ${m.pool}곳 중 <b>${m.n}곳</b>을 무작위로 뽑았어 (시드 ${m.seed}, 판정 분포 ${Object.entries(m.vc).map(([k,v])=>k+' '+v).join(' · ')}).`;
  document.getElementById('list').innerHTML=DATA.items.map(it=>{const a=A[it.id]||{},done=a.place&&a.evi&&a.verdict;
    return `<div class="it${done?' done':''}" id="it-${esc(it.id)}">
     <div class="it-hd"><div><div class="no">#${it.no} · ${esc(it.region)} · ${esc(it.cat)}</div><div class="nm">${esc(it.name)}</div><div class="meta">${esc(it.area)}</div></div>
      <div class="v v-${esc(it.v)}">${esc(it.v)}<small>휠체어 판정</small></div></div>
     <div class="ev"><span class="src">AI 근거 · ${esc(it.src)}</span><br>${esc(it.t)}${it.w?`<em>주의 · ${esc(it.w)}</em>`:''}</div>
     <a class="open" href="${esc(it.u)}" target="_blank" rel="noopener">원문 열기 ↗</a>
     <div class="qs">${QS.map(([k,l,os])=>`<div class="q"><span>${l}</span><div class="opts" role="radiogroup" aria-label="${l}">${os.map(o=>`<label><input type="radio" name="${esc(it.id)}-${k}" value="${o}" ${a[k]===o?'checked':''} onchange="setA('${esc(it.id)}','${k}',this.value)"><span>${o}</span></label>`).join('')}</div></div>`).join('')}
      <input class="memo" placeholder="메모 (선택) · 예: 입구 계단 2칸이라고 적혀 있음" value="${esc(a.memo||'')}" onchange="setA('${esc(it.id)}','memo',this.value)" aria-label="메모"></div>
    </div>`}).join('');
  document.getElementById('foot').textContent=m.only?'전수 검증이라 표본 오차는 없어. 대신 ‘불가’가 아닌데 놓친 곳(거짓 음성)은 이 시트로 알 수 없어.':'표본이 30곳이라 신뢰구간이 넓어. 예를 들어 28/30이 맞으면 정확도 93.3%, 95% 신뢰구간은 약 78.7~98.2%야. 기획서에는 이 구간을 같이 적어.';
  stat();
}
function setA(id,k,v){A[id]=A[id]||{};A[id][k]=v;save();stat();
  const a=A[id],el=document.getElementById('it-'+id);if(el)el.classList.toggle('done',!!(a.place&&a.evi&&a.verdict))}
function resetAll(){if(!confirm('답을 전부 지울까?'))return;A={};save();render()}
function exportCSV(){
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const rows=[['no','id','region','name','verdict','source','ai_evidence','url','place_match','evidence_in_source','verdict_correct','memo']]
    .concat(DATA.items.map(it=>{const a=A[it.id]||{};return [it.no,it.id,it.region,it.name,it.v,it.src,it.t,it.u,a.place,a.evi,a.verdict,a.memo]}));
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='EasyTrip_정확도검증_'+(DATA.meta.only?DATA.meta.only+'_전수':DATA.meta.n+'곳')+'_결과.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
render();
</script>
</body>
</html>
